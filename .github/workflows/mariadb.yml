name: MariaDB Initial SQL Test

permissions:
  contents: read

on:
  workflow_call:

jobs:
  test-mariadb:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.5
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL:   mysql   -h 127.0.0.1 -P 3306 -uroot -proot_password
      MYSQLADM: mysqladmin -h 127.0.0.1 -P 3306 -uroot -proot_password

    steps:
    - uses: actions/checkout@v7

    - name: Wait until MariaDB responds
      run: |
        for i in {1..60}; do
          $MYSQLADM ping --silent && { echo "MariaDB ready"; exit 0; }
          sleep 5
        done
        echo "MariaDB not ready" && exit 1

    - name: Apply initial SQL
      run: $MYSQL test_db < parts/setup/db/soundowl_table_mysql.sql

    - name: Verify tables, triggers and views
      run: |
        extract() { grep -oP "$1" parts/setup/db/soundowl_table_mysql.sql; }

        tables=$(   extract '^CREATE TABLE `\K[^`]+(?=`)' )
        triggers=$( extract '^CREATE TRIGGER (?:`)?\K\w+' )
        views=$(    extract '^CREATE VIEW (?:`)?\K\w+' )

        check () {
          act=$($MYSQL -N -e "$1")
          for n in $3; do echo "$act" | grep -qw "$n" || { echo "$2 $n is missing"; exit 1; }; done
        }

        check "SHOW TABLES FROM test_db;"                               table   "$tables"
        check "SHOW TRIGGERS FROM test_db;"                            trigger "$triggers"
        check "SHOW FULL TABLES FROM test_db WHERE Table_type='VIEW';"  view    "$views"

    - name: Verify initial history partition without legacy event
      run: |
        test "$($MYSQL -N -D test_db -e "SELECT COUNT(*) FROM information_schema.PARTITIONS WHERE TABLE_SCHEMA='test_db' AND TABLE_NAME='sound_play_history' AND PARTITION_NAME='p_initial'")" = 1
        test "$($MYSQL -N -D test_db -e "SELECT COUNT(*) FROM information_schema.EVENTS WHERE EVENT_SCHEMA='test_db' AND EVENT_NAME='manage_partitions_event'")" = 0
        test "$($MYSQL -N -D test_db -e "SELECT COUNT(*) FROM information_schema.ROUTINES WHERE ROUTINE_SCHEMA='test_db' AND ROUTINE_NAME='manage_partitions_and_compact_ids'")" = 0
