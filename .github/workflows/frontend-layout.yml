name: Frontend Layout Regression

on:
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "css/**"
      - "img/**"
      - "index.html"
      - "manifest.json"
      - ".github/workflows/frontend-layout.yml"

permissions:
  contents: read

jobs:
  layout-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    env:
      SOUNDOWL_LAYOUT_MAX_DIFF_PIXELS: "0"
      SOUNDOWL_LAYOUT_MAX_DIFF_RATIO: "0"
      SOUNDOWL_LAYOUT_PIXEL_THRESHOLD: "0.02"
      SOUNDOWL_LAYOUT_NETWORK_IDLE_TIMEOUT_MS: "3000"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare layout with committed baseline
        run: npm run test:layout:ci

      - name: Upload layout comparison artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-layout-regression
          path: |
            frontend/test-results/layout-regression
            frontend/test-results/playwright
            frontend/playwright-report
          retention-days: 14
