name: Temporary Completed Layout Baseline Capture

on:
  pull_request:
    branches: ["codex/frontend-layout-regression"]

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
            label: windows-chromium
            exclude_routes: ""
          - os: ubuntu-latest
            browser: firefox
            label: ubuntu-firefox
            exclude_routes: sound-sculpt-debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      SOUNDOWL_LAYOUT_BROWSER: ${{ matrix.browser }}
      SOUNDOWL_LAYOUT_EXCLUDE_ROUTES: ${{ matrix.exclude_routes }}
      SOUNDOWL_LAYOUT_BASELINE_DIR: ${{ github.workspace }}/frontend/tests/layout-baselines/${{ matrix.label }}
      SOUNDOWL_LAYOUT_REFERENCE_ROOT: ${{ github.workspace }}/frontend/tests/completed-reference
      SOUNDOWL_LAYOUT_REFERENCE_STATIC_INDEX: "1"
      SOUNDOWL_LAYOUT_NETWORK_IDLE_TIMEOUT_MS: "3000"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install capture dependencies
        run: npm ci

      - name: Install Firefox and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps firefox

      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Capture synthetic dark-mode baselines
        run: npm run test:layout:update-baseline

      - name: Upload captured baseline
        uses: actions/upload-artifact@v7
        with:
          name: completed-layout-baseline-${{ matrix.label }}
          path: frontend/tests/layout-baselines/${{ matrix.label }}
          retention-days: 7
