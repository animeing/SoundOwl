name: Temporary Vuetify v3 Layout Baseline Capture

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/frontend-layout-baseline-capture.yml"

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
            label: windows-chromium
            exclude_routes: ""
          - os: ubuntu-latest
            browser: firefox
            label: ubuntu-firefox
            exclude_routes: sound-sculpt-debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      SOUNDOWL_LAYOUT_BROWSER: ${{ matrix.browser }}
      SOUNDOWL_LAYOUT_EXCLUDE_ROUTES: ${{ matrix.exclude_routes }}
      SOUNDOWL_LAYOUT_BASELINE_DIR: ${{ github.workspace }}/frontend/tests/layout-baselines/${{ matrix.label }}
      SOUNDOWL_LAYOUT_REFERENCE_ROOT: ${{ github.workspace }}/reference
      SOUNDOWL_LAYOUT_NETWORK_IDLE_TIMEOUT_MS: "3000"

    steps:
      - uses: actions/checkout@v7

      - name: Check out last Vuetify v3 commit
        uses: actions/checkout@v7
        with:
          ref: 2fb6d510c066162d19829e6d779cd1e128b18105
          path: reference
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install capture dependencies
        run: npm ci

      - name: Install v3 dependencies
        run: npm ci
        working-directory: reference/frontend

      - name: Build v3 frontend
        run: npm run build
        working-directory: reference/frontend

      - name: Install Firefox and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps firefox

      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Capture synthetic dark-mode baselines
        run: npm run test:layout:update-baseline

      - name: Upload captured baseline
        uses: actions/upload-artifact@v7
        with:
          name: v3-layout-baseline-${{ matrix.label }}
          path: frontend/tests/layout-baselines/${{ matrix.label }}
          retention-days: 7
