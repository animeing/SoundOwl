name: Capture Frontend Layout Baselines

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  capture:
    if: github.event.label.name == 'layout-baseline-update'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
            label: windows-chromium
            exclude_routes: ''
          - os: ubuntu-latest
            browser: firefox
            label: ubuntu-firefox
            exclude_routes: sound-sculpt-debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      SOUNDOWL_LAYOUT_BROWSER: ${{ matrix.browser }}
      SOUNDOWL_LAYOUT_BASELINE_DIR: ${{ github.workspace }}/frontend/tests/layout-baselines/capture-${{ matrix.label }}
      SOUNDOWL_LAYOUT_EXCLUDE_ROUTES: ${{ matrix.exclude_routes }}
      SOUNDOWL_LAYOUT_REFERENCE_ROOT: ${{ github.workspace }}
      SOUNDOWL_LAYOUT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
      SOUNDOWL_LAYOUT_SOURCE_RUN: ${{ github.run_id }}
      SOUNDOWL_LAYOUT_BACKEND_URL: http://127.0.0.1:18081/
      SOUNDOWL_LAYOUT_NETWORK_IDLE_TIMEOUT_MS: '3000'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps firefox

      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Build frontend
        run: npm run build

      - name: Capture synthetic layout baselines
        run: npm run test:layout:update-baseline

      - name: Upload captured baselines
        uses: actions/upload-artifact@v7
        with:
          name: frontend-layout-baselines-${{ matrix.label }}
          path: frontend/tests/layout-baselines/capture-${{ matrix.label }}
          retention-days: 3
