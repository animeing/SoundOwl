name: Temporary SoundSculpt Layout Baseline Capture

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/frontend-layout-baseline-capture.yml"
      - "frontend/src/layout/settings/contents/SoundSculptDebug.vue"

permissions:
  contents: read

jobs:
  capture-layout-baselines:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    env:
      SOUNDOWL_LAYOUT_BROWSER: chromium
      SOUNDOWL_LAYOUT_BASELINE_DIR: ${{ github.workspace }}/frontend/tests/layout-baselines/capture-windows-chromium
      SOUNDOWL_LAYOUT_REFERENCE_ROOT: ${{ github.workspace }}
      SOUNDOWL_LAYOUT_ROUTE_FILTER: sound-sculpt-debug
      SOUNDOWL_LAYOUT_BACKEND_URL: "http://127.0.0.1:18081/"
      SOUNDOWL_LAYOUT_NETWORK_IDLE_TIMEOUT_MS: "3000"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build frontend
        run: npm run build

      - name: Capture synthetic SoundSculpt layout baselines
        run: npm run test:layout:update-baseline

      - name: Upload captured baselines
        uses: actions/upload-artifact@v7
        with:
          name: frontend-layout-baselines-windows-chromium-sound-sculpt
          path: frontend/tests/layout-baselines/capture-windows-chromium
          retention-days: 3
