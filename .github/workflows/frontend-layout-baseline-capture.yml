name: Temporary Frontend Layout Baseline Capture

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/frontend-layout-baseline-capture.yml"

permissions:
  contents: read

jobs:
  capture-layout-baselines:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
            label: windows-chromium
            exclude_routes: ""
          - os: ubuntu-latest
            browser: firefox
            label: ubuntu-firefox
            exclude_routes: sound-sculpt-debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend

    env:
      SOUNDOWL_LAYOUT_BROWSER: ${{ matrix.browser }}
      SOUNDOWL_LAYOUT_BASELINE_DIR: ${{ github.workspace }}/frontend/tests/layout-baselines/capture-${{ matrix.label }}
      SOUNDOWL_LAYOUT_EXCLUDE_ROUTES: ${{ matrix.exclude_routes }}
      SOUNDOWL_LAYOUT_REFERENCE_ROOT: ${{ github.workspace }}
      SOUNDOWL_LAYOUT_BACKEND_URL: "http://127.0.0.1:18081/"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps firefox

      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Build frontend
        run: npm run build

      - name: Capture synthetic layout baselines
        run: npm run test:layout:update-baseline

      - name: Upload captured baselines
        uses: actions/upload-artifact@v7
        with:
          name: frontend-layout-baselines-${{ matrix.label }}
          path: frontend/tests/layout-baselines/capture-${{ matrix.label }}
          retention-days: 3
