name: Update Frontend Layout Baselines

on:
  issue_comment:
    types: [created]

concurrency:
  group: frontend-layout-baseline-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  authorize:
    if: github.event.issue.pull_request && github.event.comment.body == '/update-layout-baselines'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_branch: ${{ steps.pr.outputs.head_branch }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Authorize command and pin PR head
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.data.permission)) {
              core.setFailed('This command requires write permission to the repository.');
              return;
            }
            const pull = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.issue.number,
            });
            if (pull.data.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('Baseline updates are supported only for branches in this repository.');
              return;
            }
            core.setOutput('head_branch', pull.data.head.ref);
            core.setOutput('head_sha', pull.data.head.sha);

  capture:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
            label: windows-chromium
            exclude_routes: ''
          - os: ubuntu-latest
            browser: firefox
            label: ubuntu-firefox
            exclude_routes: sound-sculpt-debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      SOUNDOWL_LAYOUT_BROWSER: ${{ matrix.browser }}
      SOUNDOWL_LAYOUT_BASELINE_DIR: ${{ github.workspace }}/frontend/tests/layout-baselines/capture-${{ matrix.label }}
      SOUNDOWL_LAYOUT_EXCLUDE_ROUTES: ${{ matrix.exclude_routes }}
      SOUNDOWL_LAYOUT_REFERENCE_ROOT: ${{ github.workspace }}
      SOUNDOWL_LAYOUT_SOURCE_REVISION: ${{ needs.authorize.outputs.head_sha }}
      SOUNDOWL_LAYOUT_SOURCE_RUN: ${{ github.run_id }}
      SOUNDOWL_LAYOUT_BACKEND_URL: http://127.0.0.1:18081/
      SOUNDOWL_LAYOUT_NETWORK_IDLE_TIMEOUT_MS: '3000'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps firefox

      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Build frontend
        run: npm run build

      - name: Capture synthetic layout baselines
        run: npm run test:layout:update-baseline

      - name: Upload captured baselines
        uses: actions/upload-artifact@v7
        with:
          name: frontend-layout-baselines-${{ matrix.label }}
          path: frontend/tests/layout-baselines/capture-${{ matrix.label }}
          retention-days: 3

  commit:
    needs: [authorize, capture]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: frontend-layout-baselines-windows-chromium
          path: .layout-baselines/windows

      - uses: actions/download-artifact@v7
        with:
          name: frontend-layout-baselines-ubuntu-firefox
          path: .layout-baselines/ubuntu

      - name: Verify and adopt captured baselines
        env:
          HEAD_BRANCH: ${{ needs.authorize.outputs.head_branch }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          test "$(find .layout-baselines/windows -type f -name '*.png' | wc -l)" -eq 112
          test "$(find .layout-baselines/ubuntu -type f -name '*.png' | wc -l)" -eq 104
          test "$(find .layout-baselines -type l | wc -l)" -eq 0
          test -z "$(find .layout-baselines -type f ! -name '*.png' ! -name 'README.md' -print -quit)"
          remote_sha="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "${remote_sha}" = "${HEAD_SHA}"
          rm -rf frontend/tests/layout-baselines
          mkdir -p frontend/tests/layout-baselines/ubuntu-firefox
          cp -a .layout-baselines/windows/. frontend/tests/layout-baselines/
          cp -a .layout-baselines/ubuntu/. frontend/tests/layout-baselines/ubuntu-firefox/

      - name: Commit and push baseline images
        id: commit
        env:
          HEAD_BRANCH: ${{ needs.authorize.outputs.head_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/tests/layout-baselines
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'PRコメントによりレイアウト基準画像を更新'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report result on pull request
        uses: actions/github-script@v8
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        with:
          script: |
            const changed = process.env.CHANGED === 'true';
            const body = changed
              ? `基準画像をPR時点のレイアウトで更新し、コミット \`${process.env.COMMIT_SHA}\` をpushしました。Windows Chromium 112枚、Ubuntu Firefox 104枚です。\n\n実行: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              : `PR時点のレイアウトと基準画像は一致しており、コミットは不要でした。\n\n実行: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
