name: NodeJS with Webpack

on:
  workflow_call:
  push:
    paths: ["frontend/**"]
    branches: [ "main" ]
  pull_request:
    paths: ["frontend/**"]
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install
      run: |
        cd frontend
        npm install
      
    - name: Test public asset boundaries
      working-directory: frontend
      run: node --test tests/server-public-assets.unit.mjs

    - name: Test audio effects
      run: npm run test:ir --prefix frontend

    - name: Test FFmpeg lazy initialization
      run: npm run test:conversion --prefix frontend

    - name: Test play history failure notice
      run: npm run test:play-history --prefix frontend

    - name : build
      run :  |
        cd frontend
        npx webpack --config webpack.config.js

    - name: upload js folder ${{ matrix.node-version }}
      uses: actions/upload-artifact@v7
      with:
        name: js-artifact-node-${{ matrix.node-version }}
        path: frontend
        retention-days: 3
